[project]
name = "seetonic"
version = "0.1.0"
description = "Ask a PDF a question and see the evidence highlighted on the page."
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.33",
    "pymupdf",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "google-cloud-storage",
    "google-cloud-bigquery",
    "httpx",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
